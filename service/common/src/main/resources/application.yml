spring:
  application:
    name: common-service

server:
  port: 8083

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:common-service}
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
