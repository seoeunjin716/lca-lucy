server:
  port: 8081

spring:
  application:
    name: user-service

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:user-service}
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
